# Configuracao alternativa para quando os microsservicos rodam na maquina
# (dotnet run) e apenas o Prometheus esta em container.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: usersapi
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5117"]

  - job_name: catalogapi
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5286"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
