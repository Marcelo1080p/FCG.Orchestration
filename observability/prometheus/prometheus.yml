# Configuracao usada quando a plataforma sobe via docker-compose ou Kubernetes,
# onde os servicos sao alcancados pelo nome no DNS interno.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: usersapi
    metrics_path: /metrics
    static_configs:
      - targets: ["usersapi:8080"]

  - job_name: catalogapi
    metrics_path: /metrics
    static_configs:
      - targets: ["catalogapi:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
